{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador - Ford Fulkerson</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>

    /* Proteger SweetAlert2 de los estilos globales del proyecto */
    .swal2-popup, 
    .swal2-title, 
    .swal2-html-container {
        border: none !important;
        box-shadow: none !important;
        outline: none !important;
    }

    .swal2-title {
        border-bottom: 0 !important; /* Elimina la línea azul */
        margin-bottom: 15px !important; /* Restaura el espaciado normal */
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #f4f7f6;
    }
    /* Estilizar el panel izquierdo */
    .panel-configuracion {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        margin: 15px;
        border: 1px solid #edf2f7;
    }
    /* Estilos base para inputs */
    input[type="number"], input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        transition: border-color 0.3s;
    }
    input:focus {
        border-color: #0288d1;
        outline: none;
    }
    /* Efecto Hover en los botones */
    button {
        transition: all 0.3s ease;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        filter: brightness(1.1);
    }
</style>
</head>
<body>
    {% csrf_token %}
    <div id="sidebar">
        <h2>1. Configuración del Grafo</h2>
        <div class="control-group">
            <label for="num-nodos">Cantidad de Nodos [7, 16]:</label>
            <input type="number" id="num-nodos" min="7" max="16" value="7">
            
            <label>Nodos Fuente (ej: 1, 2) [Máx 2]:</label>
            <input type="text" id="input-fuentes" value="1">

            <label>Nodos Sumidero (ej: 7, 6) [Máx 2]:</label>
            <input type="text" id="input-sumideros" value="7">
            
            <button class="primary" onclick="inicializarNodos()">Generar Nodos</button>
        </div>

        <h2>2. Creación Manual</h2>
        <div class="control-group">
            <div class="row-inputs">
                <div>
                    <label>Origen</label>
                    <input type="number" id="edge-from" placeholder="Ej: 1">
                </div>
                <div>
                    <label>Destino</label>
                    <input type="number" id="edge-to" placeholder="Ej: 2">
                </div>
            </div>
            <div>
                <label>Capacidad</label>
                <input type="number" id="edge-cap" placeholder="Ej: 15">
            </div>
            <button class="primary" onclick="agregarArista()">Añadir Arista</button>
        </div>

        <h2>3. Creación Aleatoria</h2>
        <div class="control-group">
            <button class="secondary" onclick="generarGrafoAleatorio()">Generar Grafo Aleatorio</button>
        </div>

        <button class="action" onclick="enviarAlServidor()">Calcular Flujo Máximo</button>
    </div>

    <div id="main-content">
        <!-- CONTENEDOR PRINCIPAL DEL GRAFO Y RESULTADOS -->
        <div style="display: flex; flex: 1; height: 100vh; overflow: hidden; width: 100%;">
            
            <!-- Zona del Grafo (Toma todo el espacio restante) -->
            <div id="mynetwork" style="flex: 1; height: 100%;"></div>

            <!-- Panel Lateral Derecho (Tabla de Resultados) -->
            <div id="panel-resultados" style="display: none; width: 400px; height: 100%; padding: 20px; background-color: #f8f9fa; border-left: 2px solid #e0e0e0; overflow-y: auto; box-sizing: border-box; font-family: sans-serif;">
                
                <h3 style="margin-top: 0; color: #0288d1; text-align: center; font-size: 18px;">Caminos de Aumento</h3>
                
                <div style="display: flex; justify-content: center; gap: 5px; margin-bottom: 15px;">
                    <button onclick="controlReproductor('prev')" style="padding: 5px 10px; cursor: pointer;">⬅️</button>
                    <button onclick="controlReproductor('play')" style="padding: 5px 10px; cursor: pointer; background-color: #4caf50; color: white; font-weight: bold; border: none; border-radius: 3px;">▶️ Auto</button>
                    <button onclick="controlReproductor('next')" style="padding: 5px 10px; cursor: pointer;">➡️</button>
                    <button onclick="resaltarRuta(-1)" style="padding: 5px 10px; cursor: pointer; background-color: #f44336; color: white; border: none; border-radius: 3px;">Reset</button>
                </div>

                <button onclick="mostrarCorteMinimo()" style="padding: 5px 10px; cursor: pointer; background-color: #212121; color: white; border: none; border-radius: 3px; font-weight: bold; margin-left: 10px;">✂️ Corte Mínimo</button>

                <table border="1" cellpadding="6" cellspacing="0" style="width: 100%; text-align: center; border-collapse: collapse; font-size: 13px; background-color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <thead style="background-color: #0288d1; color: white;">
                        <tr>
                            <th style="width: 15%;">#</th>
                            <th style="width: 60%;">Ruta Encontrada</th>
                            <th style="width: 25%;">Flujo</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-rutas">
                        <!-- JavaScript llenará esto -->
                    </tbody>
                    <tfoot>
                        <tr style="font-weight: bold; background-color: #e1f5fe;">
                            <td colspan="2" style="text-align: right; padding-right: 10px;">FLUJO MÁXIMO:</td>
                            <td id="total-flujo" style="color: #d32f2f; font-size: 15px;">0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            
        </div>
    </div>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
